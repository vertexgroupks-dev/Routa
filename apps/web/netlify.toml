# Netlify builds ONLY the website (apps/web). The driver app (apps/driver) is a phone app and is not deployed here.
[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"
  # Public values (they are sent to the browser anyway). Never put secrets here.
  NEXT_PUBLIC_SUPABASE_URL = "https://pfdidtlgmdtthobjuozk.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_i_y7TsgGhEJcTtOZVV4ggA_KsK18skN"

# Runs the Next.js app on Netlify (server pages, middleware, login).
[[plugins]]
  package = "@netlify/plugin-nextjs"
